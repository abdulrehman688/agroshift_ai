plugins {
    id "com.android.application"
}

android {
    namespace "com.agroshift.app"
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.agroshift.app"
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        versionCode 9
        versionName "0.5.1"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        // Optimized, non-debuggable build for installing on test phones. Not for store release.
        preview {
            initWith release
            signingConfig signingConfigs.debug
            matchingFallbacks = ["release"]
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:${rootProject.ext.desugarVersion}"
    implementation project(":core-ui")
    implementation project(":core-data")
    implementation project(":core-sync")
    implementation project(":feature-account")
    implementation project(":feature-farm")
    implementation project(":feature-advisor")
    implementation project(":feature-market")
    implementation project(":feature-help")
    implementation project(":feature-home")
    implementation "androidx.activity:activity:1.9.3"
    implementation "androidx.lifecycle:lifecycle-process:${rootProject.ext.lifecycleVersion}"
    implementation "androidx.lifecycle:lifecycle-service:${rootProject.ext.lifecycleVersion}"
    implementation "androidx.navigation:navigation-fragment:${rootProject.ext.navigationVersion}"
    implementation "androidx.navigation:navigation-ui:${rootProject.ext.navigationVersion}"
}
